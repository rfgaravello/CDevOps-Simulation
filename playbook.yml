---
- name: Pos-Deploy Validation and Configuration Audit
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Aguardar a API do sistema medico responder (Healthcheck)
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/health"
        status_code: 200
        method: GET
        force_basic_auth: yes  # Força o Ansible a tratar a requisição de forma direta e persistente
        return_content: yes
      register: result
      until: result.status == 200
      retries: 10
      delay: 5

    - name: Validar resposta do componente de telemetria
      ansible.builtin.assert:
        that:
          - "'UP' in _result.json.status"
        fail_msg: "A aplicacao falhou nos testes de validacao pos-deploy!"
        success_msg: "Auditoria de integridade realizada com sucesso."

    - name: Simular envio de carga/metrica de telemetria medica
      ansible.builtin.uri:
        url: "http://localhost/api/v1/telemetry"
        method: POST
        body_format: json
        body:
          device_id: "MONITOR-VARGINHA-01"
          heart_rate: 78
        status_code: 200
      register: _telemetry_test

    - name: Exibir log de deploy bem-sucedido
      ansible.builtin.debug:
        msg: "Pipeline concluido. App rodando em ambiente: {{ _telemetry_test.json.environment }}"