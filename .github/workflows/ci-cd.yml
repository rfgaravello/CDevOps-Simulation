name: End-to-End Local DevOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Security Scan (SAST)
      run: |
        pip install bandit
        bandit -r app.py

  local-deploy-and-test:
    needs: lint-and-test
    runs-on: self-hosted # Roda no seu WSL (Linux Local)
    steps:
    - uses: actions/checkout@v4

    - name: Enviar Imagem Docker para o ambiente do Minikube
      run: |
        # Chama o Minikube do Windows com o sufixo .exe
        minikube.exe image build -t telemetry-app:local .

    - name: Executar Terraform (IaC)
      run: |
        terraform.exe init
        terraform.exe apply -auto-approve -lock=false

    - name: Executar Automacao e Auditoria com Ansible
      run: |
        # Atualiza a lista de pacotes do Ubuntu de forma nao-interativa
        sudo apt-get update -y
        
        # Instala o pip e o venv forçando o modo automatico
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-pip python3-venv
        
        # Cria e ativa o ambiente virtual isolado
        python3 -m venv venv
        source venv/bin/activate
        
        # Instala o Ansible dentro do venv
        pip install --upgrade pip
        pip install ansible
        
        # Executa o playbook nativamente com suporte total a UTF-8
        ansible-playbook playbook.yml